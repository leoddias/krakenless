name: Release

# Cutting a release is a deliberate act: push a tag like `v0.1.0-alpha` and this
# builds the installers and publishes them as a GitHub Release. Nothing here
# runs on an ordinary push — CI artifacts are auth-gated and expire in 14 days,
# which is why they cannot serve as a public download.
#
# This is now the *only* automated gate in the repository: the per-push CI
# workflow was removed, so lint, format, clippy and both test suites run here
# or nowhere.
#
# The release is created as a **draft**: the binaries are unsigned, so Windows
# SmartScreen and macOS Gatekeeper will both warn about them, and whoever
# publishes should have written that into the release notes first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.os }}

      - run: npm ci

      # These used to live in a CI workflow that ran on every push. With that
      # gone, the release is the only gate there is, so it carries them: a
      # release must not be cut from code that fails its own checks.
      - run: npm run lint
      - run: npm run format:check

      # Before *any* cargo command: `custom-protocol` is a default feature, so
      # `generate_context!` embeds `dist/` at compile time and panics when it is
      # not there. `tauri build` would run this itself, but `cargo test` below
      # comes first and needs it just as much.
      - run: npm run build

      # A release must not be cut from code that does not pass its own gate.
      - name: Git identity for integration tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: git --version
      - run: npm test
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # Without a signing key the bundler cannot produce the `.sig` files the
      # updater needs, and `createUpdaterArtifacts` makes it fail rather than
      # quietly skip them. Checked here anyway so the failure names the missing
      # secret instead of surfacing as a bundler error twenty minutes in.
      - name: Require the update signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Without it the release"
            echo "::error::ships binaries no installed copy of Krakenless will accept."
            exit 1
          fi

      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-release
          # Only the installable artefacts; the bundle directory also holds
          # intermediate app directories that are useless to a downloader.
          #
          # `.nsis.zip`, `.msi.zip` and `.app.tar.gz` are the updater's payloads
          # — what it downloads and hands to the installer — and each `.sig`
          # beside them is the only proof the app has that this project built what
          # it just downloaded. A release missing them is a release nobody can
          # update to.
          find src-tauri/target/release/bundle \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.nsis.zip' -o -name '*.msi.zip' -o -name '*.sig' \) \
            -exec cp {} dist-release/ \;
          ls -la dist-release

      # The bundler produces installers; the binary they install runs on its
      # own. Shipping it means a user can run Krakenless without writing to
      # Program Files or the registry — which is also the only way to try it on
      # a machine where they are not allowed to install software.
      - name: Collect the portable executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          cp src-tauri/target/release/krakenless.exe "dist-release/Krakenless_${version}_x64_portable.exe"
          ls -la dist-release

      # The bundler signs what it bundles, and this is not a bundle: it is the
      # raw binary, copied out of the build directory. So it is signed here, by
      # hand, with the same key, because `updater.rs` refuses to install
      # anything it cannot verify and the portable build is the one that has no
      # installer to fall back to.
      - name: Sign the portable executable
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          npm run tauri -- signer sign "dist-release/Krakenless_${version}_x64_portable.exe"

      # A payload whose signature did not make it into the release is a payload
      # every copy of the app will refuse, and it looks like a working release
      # right up until somebody tries to update.
      #
      # The payloads are *named*, not globbed. An earlier version of this step
      # looped over `*.nsis.zip` and friends, and when Tauri stopped producing
      # that shape the glob matched nothing, the loop skipped it, and the step
      # passed while checking almost nothing. A missing payload has to be as
      # loud as an unsigned one.
      - name: Verify every updater payload has its signature
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$RUNNER_OS" = "Windows" ]; then
            expected=("Krakenless_${version}_x64-setup.exe" \
                      "Krakenless_${version}_x64_en-US.msi" \
                      "Krakenless_${version}_x64_portable.exe")
          else
            expected=("Krakenless.app.tar.gz")
          fi
          failed=0
          for name in "${expected[@]}"; do
            if [ ! -f "dist-release/$name" ]; then
              echo "::error::$name is missing — the updater manifest names this file"
              failed=1
            elif [ ! -f "dist-release/$name.sig" ]; then
              echo "::error::$name has no .sig beside it; every copy of the app would refuse it"
              failed=1
            else
              echo "  ok: $name"
            fi
          done
          exit $failed

      # The failure this catches shipped twice before it was noticed: a binary
      # compiled without `tauri/custom-protocol` opens the dev server URL
      # instead of the embedded UI, so it looks perfect on a developer machine
      # with `npm run dev` running and shows "connection refused" everywhere
      # else. Nothing about the build fails — the app simply has no interface in
      # it. So the artefact is asked directly whether it contains the frontend
      # that was just compiled.
      - name: Verify the frontend is embedded in the binary
        shell: bash
        run: |
          asset=$(ls dist/assets/index-*.js | head -1 | xargs -n1 basename)
          echo "Looking for /assets/$asset inside the built binaries"
          found=0
          for binary in src-tauri/target/release/krakenless src-tauri/target/release/krakenless.exe; do
            [ -f "$binary" ] || continue
            if grep -qF "/assets/$asset" "$binary"; then
              echo "  ok: $binary"
              found=1
            else
              echo "  FAIL: $binary does not contain the frontend — it would open $(node -p "require('./src-tauri/tauri.conf.json').build.devUrl") at runtime"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No binary was found to check"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - run: ls -la installers

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          # Named explicitly rather than inferred from the ref. The release is
          # usually started by `version.yml` with `gh workflow run --ref <tag>`,
          # because a tag pushed with GITHUB_TOKEN raises no event — and a
          # dispatched run is not a tag-push run, so nothing should be left to
          # infer about which tag this is.
          tag_name: ${{ github.ref_name }}
          # Draft, not published: someone has to read the notes and decide the
          # binaries are ready to hand to people.
          draft: true
          generate_release_notes: true
          body: |
            **Pre-alpha.** Krakenless has not been dogfooded yet — see the
            README for what works and what does not.

            These installers are **unsigned**. Windows SmartScreen will say the
            publisher is unknown, and macOS Gatekeeper will refuse to open the
            app until you allow it in System Settings → Privacy & Security.
            Building from source avoids both.
