name: Pages

# The landing page is plain static files in `site/`, so there is nothing to
# build — this workflow only uploads them.
#
# It deploys when a **release is published**, not when the Release workflow
# succeeds. That workflow creates a *draft*, and a draft's assets have no
# public download URLs at all: deploying then would ship a page whose every
# download button 404s until a human got round to publishing. `release:
# published` fires at the moment the links start working, which is the moment
# the page should change.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Which release the page should point at. On a release event that is the
      # one just published; on a push to `site/` or a manual run it is whatever
      # is currently the latest, so editing the page's prose never silently
      # rolls its download links back to an older version.
      - name: Resolve the release to advertise
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName --jq .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # `v0.1.5-alpha` -> `0.1.5`: the tag names the release, the bare
          # version names the asset files.
          version=$(printf '%s' "$tag" | sed -E 's/^v//; s/-.*$//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Advertising $tag (assets named $version)"

      # Rewritten in the checkout, never committed. The file in the repository
      # keeps real, working values so it can be opened and reviewed on its own;
      # this only moves them forward to the release being advertised.
      - name: Point the downloads at that release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E \
            -e "s#/releases/download/v[0-9]+\.[0-9]+\.[0-9]+[^/]*/#/releases/download/${TAG}/#g" \
            -e "s#Krakenless_[0-9]+\.[0-9]+\.[0-9]+_#Krakenless_${VERSION}_#g" \
            -e "s#Version <strong>[0-9]+\.[0-9]+\.[0-9]+[^<]*</strong>#Version <strong>${TAG#v}</strong>#g" \
            site/index.html
          grep -o 'Krakenless_[^"]*' site/index.html | sort -u

      # A download button that 404s is worse than an out-of-date one: it reads
      # as "the project is broken" rather than "the page is behind". Every file
      # the page offers is checked against what the release actually holds, and
      # a mismatch stops the deploy with the names side by side.
      - name: Verify every advertised file exists in the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/have.txt
          grep -o 'Krakenless_[^"]*' site/index.html | sort -u > /tmp/want.txt
          echo "Release holds:"; sed 's/^/  /' /tmp/have.txt
          echo "Page offers:";   sed 's/^/  /' /tmp/want.txt
          missing=$(comm -23 /tmp/want.txt /tmp/have.txt)
          if [ -n "$missing" ]; then
            echo "::error::These files are linked on the page but are not in $TAG:"
            printf '  %s\n' $missing
            exit 1
          fi

      # The update manifests the app polls. They are served from here rather
      # than from the release itself for one blunt reason: every release so far
      # is a prerelease, and `releases/latest/download/` does not see those at
      # all. This workflow also runs at exactly the right moment — a release's
      # assets acquire public download URLs when it is published, which is the
      # event above — so a draft release advertises nothing.
      #
      # Two files, not one. `windows-x86_64.json` is the shape
      # `tauri-plugin-updater` parses; `windows-x86_64-portable.json` is this
      # project's own, for the portable executable the plugin cannot update.
      # Adding portable fields to the first would stake the portable path on the
      # plugin's deserializer ignoring keys it does not know. See ADR-0036.
      #
      # Windows only for now: an endpoint that 404s is how the updater says
      # "nothing here", which is the truth on macOS until it is a shipped
      # target.
      - name: Build the update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$work/assets.txt"
          echo "Release holds:"; sed 's/^/  /' "$work/assets.txt"

          # A release cut before the updater existed carries no signatures at
          # all, and it has nothing to advertise: no copy of the app can update
          # to it, and none is asking. Skipping is the truthful outcome, and it
          # keeps `$TAG` — which on a `site/**` push is just "whatever is
          # latest" — from failing a deploy that is only about the page.
          # A release with *some* signatures and not the ones the manifests
          # need is a different thing entirely, and `pick` below fails on it.
          if ! grep -q '\.sig$' "$work/assets.txt"; then
            echo "::notice::$TAG has no signatures; it predates the updater. No manifests written."
            exit 0
          fi

          gh release download "$TAG" --dir "$work" --pattern '*.sig'
          published=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)

          # Release notes. Whole lines only, capped by size rather than by line
          # count: the first version of this took `head -3` and cut the body
          # mid-sentence, which is exactly what the user saw in the app. The
          # dialog scrolls, so length was never the problem the truncation was
          # solving — keeping the manifest small is, and 4 kB is already more
          # than anybody reads in a dialog.
          notes=$(gh release view "$TAG" --json body --jq .body | tr -d '\r' \
                  | awk '{ total += length($0) + 1; if (total > 4000) exit; print }')

          # Named from the asset list rather than reconstructed, so a change to
          # the bundler's naming fails here instead of shipping a manifest whose
          # URL 404s.
          pick() {
            local found
            found=$(grep -E "$1" "$work/assets.txt" | head -1 || true)
            if [ -z "$found" ]; then
              echo "::error::no release asset matches $1 — the app cannot update to $TAG" >&2
              exit 1
            fi
            printf '%s' "$found"
          }

          manifest() {
            local out="$1" asset="$2" date_key="$3"
            if [ ! -f "$work/${asset}.sig" ]; then
              echo "::error::${asset} has no signature in the release; without one every" >&2
              echo "::error::copy of Krakenless will refuse the download." >&2
              exit 1
            fi
            jq -n \
              --arg version "$VERSION" \
              --arg notes "$notes" \
              --arg date "$published" \
              --arg dateKey "$date_key" \
              --arg url "$base/$asset" \
              --arg signature "$(cat "$work/${asset}.sig")" \
              '{version: $version, notes: $notes}
               + {($dateKey): $date}
               + {platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
              > "$out"
            echo "$out -> $asset"
          }

          # The NSIS *installer*, not a zip around it. Tauri 2 signs the
          # installer directly and the updater runs it as-is; the `.nsis.zip`
          # wrapper belonged to an earlier shape of this plugin and no longer
          # appears in the bundle at all.
          mkdir -p site/updates
          manifest site/updates/windows-x86_64.json "$(pick '_x64-setup\.exe$')" pub_date
          manifest site/updates/windows-x86_64-portable.json \
                   "$(pick '_x64_portable\.exe$')" pubDate
          cat site/updates/*.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
