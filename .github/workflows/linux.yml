name: Linux (on demand)

# Linux is not a v0.1 target and is not in the CI gate: its job wedged the
# ubuntu runner on every attempt — the step ran past its own timeout, an
# OS-level `timeout --signal=KILL` did not end it, and the job was eventually
# cancelled by the infrastructure, which publishes no log at all.
#
# This workflow keeps the investigation runnable without letting it block a
# platform we do ship. What is already known:
#
#   * Not compilation: `cargo test --no-run` succeeds in ~75s.
#   * Not resources: `df`/`free` are healthy right before the wedge.
#   * Not the binary harness (`main.rs` linking WebKitGTK): execution never
#     reaches it.
#   * The frontend suite, including its git integration tests, passes on Linux.
#   * The same tests pass on real Linux under WSL in ~1.1s — though WSL itself
#     crashed under repeated runs, which points the same direction.
#
# So the wedge is inside the lib tests. The steps below run one group each, so
# the last step that succeeded and the one left running name the culprit —
# step conclusions stay readable through the API even when logs do not publish.
on:
  workflow_dispatch:

jobs:
  bisect:
    name: Locate the Linux wedge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ubuntu-bisect

      # Tauri links against WebKitGTK, which the runner image does not ship.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev

      - run: npm ci

      - name: Git identity
        run: |
          git --version
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Resources
        run: |
          df -h /
          free -m
          nproc

      - name: Build tests
        timeout-minutes: 20
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run

      - name: 'Lib: config'
        timeout-minutes: 5
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib config:: -- --test-threads=1

      - name: 'Lib: watcher'
        timeout-minutes: 5
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib watcher:: -- --test-threads=1

      - name: 'Lib: runner validation'
        timeout-minutes: 5
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib git_runner::tests::rejects -- --test-threads=1

      - name: 'Lib: runner capture'
        timeout-minutes: 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1 \
            git_runner::tests::captures_stdout_and_zero_exit_code \
            git_runner::tests::surfaces_nonzero_exit_code_and_stderr \
            git_runner::tests::decode_flags_invalid_utf8_instead_of_hiding_it \
            git_runner::tests::an_unreadable_pipe_is_an_error_not_empty_output \
            git_runner::tests::redirecting_git_env_vars_are_not_inherited

      - name: 'Lib: runner stdin'
        timeout-minutes: 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1 \
            git_runner::tests::feeds_stdin_to_the_child \
            git_runner::tests::without_stdin_the_child_sees_eof_immediately \
            git_runner::tests::a_large_stdin_payload_does_not_deadlock

      - name: 'Lib: external launcher'
        timeout-minutes: 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib external:: -- --test-threads=1

      # The prime suspect: it deliberately makes a child hang, then kills a
      # process group. Last on purpose, so everything before it is known good.
      - name: 'Lib: runner timeout and kill'
        timeout-minutes: 6
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1 \
            git_runner::tests::a_zero_timeout_is_clamped_to_a_usable_floor \
            git_runner::tests::arguments_are_not_shell_interpreted \
            git_runner::tests::a_hanging_child_is_killed_and_the_call_returns

      - name: Tauri build
        timeout-minutes: 25
        run: npm run tauri -- build
