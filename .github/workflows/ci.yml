name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Lint + test (frontend)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # The suite includes integration tests that drive the real git binary on
      # disposable repositories, so the version it ran against is worth having
      # in the log when one of them fails.
      - run: git --version
      - run: npm test
      - run: npm run build

  desktop:
    # Windows is the v0.1 target; macOS builds here so the unix code paths
    # (process groups, `reveal_folder`, path separators) keep a real check.
    #
    # Linux is deliberately absent: its job wedged the runner every time —
    # 45 minutes, no log, cancelled by the infrastructure. It lives in
    # `linux.yml`, run on demand, so an unshipped platform cannot block the
    # shipped one. See docs/ROADMAP.md § Backlog for what was ruled out.
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: npm ci

      # The suite drives the real git binary; it must be identifiable and
      # configured, because `git commit` in a fresh temp repo needs an identity.
      - name: Git identity for integration tests
        run: |
          git --version
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Frontend tests
        timeout-minutes: 15
        run: npm test

      # Before *any* cargo command: `custom-protocol` is a default feature, so
      # `generate_context!` embeds `dist/` at compile time and panics when it is
      # not there.
      - run: npm run build

      - name: Clippy
        timeout-minutes: 20
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        timeout-minutes: 15
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri build
        timeout-minutes: 25
        run: npm run tauri -- build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: krakenless-${{ matrix.label }}
          # Only the installers and binaries, not the whole target directory.
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/krakenless
            src-tauri/target/release/krakenless.exe
          if-no-files-found: warn
          retention-days: 14
