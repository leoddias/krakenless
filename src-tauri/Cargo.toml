[package]
name = "krakenless"
version = "0.6.2"
description = "Fast, private desktop Git GUI"
authors = ["Leonardo Dias"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "krakenless_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the frontend into the binary. Without it `generate_context!` embeds
# `devUrl` instead (tauri-macros: `dev: cfg!(not(feature = "custom-protocol"))`),
# and the built app opens http://localhost:1420 — a blank "connection refused"
# page on any machine that is not running `npm run dev`. That is what shipped in
# v0.1.0-alpha and v0.1.1-alpha.
#
# `tauri build` passes `--features tauri/custom-protocol` itself, but nothing
# else does: a plain `cargo build --release` produces a binary with no UI inside
# it, and the release cannot depend on which wrapper invoked cargo. Declaring it
# as a default makes every release build correct on its own; `tauri dev` turns it
# off again with `--no-default-features`. DO NOT REMOVE.
#
# Consequence: `frontendDist` (`../dist`) must exist before *any* cargo command
# runs, including `cargo test` and `cargo clippy` — the codegen panics without
# it. Both workflows run `npm run build` first for that reason.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
notify = "8"

# The updater. `minisign-verify` and `base64` are the portable path's half of
# it: `tauri-plugin-updater` verifies what it downloads itself, but it only
# downloads installers, so `updater.rs` repeats the same check against the same
# key for the portable executable. `reqwest` is how it fetches those bytes.
minisign-verify = "0.2"
base64 = "0.22"
# Pinned to the same major the updater plugin uses: two reqwest versions means
# two TLS stacks compiled into the binary for no benefit. `system-proxy` is not
# optional either — a machine behind a corporate proxy is exactly the machine
# whose user cannot install software and is therefore running the portable
# build.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }

# Desktop only: there is no self-updating app bundle to replace on a phone, and
# the plugins do not build for those targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
